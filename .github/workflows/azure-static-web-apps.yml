name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Prepare deploy bundle
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp index.html config.js robots.txt sitemap.xml staticwebapp.config.json _deploy/
          cp -r assets css legal support _deploy/
          cp -r drone-weather-app paramotor-weather-app aviation-home-screen-widget aviation-lock-screen-widget vfr-personal-minimums-guide _deploy/
          test -f _deploy/css/styles.css
          test -f _deploy/assets/vfr-buddy-favicon-180.png
          ls -la _deploy _deploy/assets _deploy/css
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: _deploy
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
